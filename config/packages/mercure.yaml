# yaml-language-server: $schema=../schema.json
mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                claims:
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: 'app'
                    client_id: 'app'

when@test:
    mercure:
        hubs:
            default:
                # the tests read the updates from the hub service, nothing is sent
                http_client: mercure.test_http_client

    services:
        mercure.test_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
