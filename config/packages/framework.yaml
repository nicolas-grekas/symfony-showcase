# yaml-language-server: $schema=../schema.json
# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true

when@prod:
    framework:
        # the public pages and API responses are served from the cache of the kernel,
        # which tells what it did in an RFC 9211 Cache-Status header
        http_cache:
            cache_status: Symfony
