# yaml-language-server: $schema=../schema.json
http_client:
    scoped_clients:
        travel_agency.client:
            base_uri: '%env(TRAVEL_AGENCY_URL)%'
            headers:
                Accept: application/json

when@test:
    http_client:
        # replays the HTTP exchanges recorded by the tests that have the #[UseRecord] attribute
        recorder: true
