# yaml-language-server: $schema=../schema.json
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # the repository creates the users who log in with the identity provider for the first time
        app_users:
            entity:
                class: App\Entity\User

    role_hierarchy:
        ROLE_ADMIN: [ROLE_ORGANIZER, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ORGANIZER: [ROLE_REVIEWER]
        # reviewers of a single conference, e.g. ROLE_REVIEWER_LILLE
        ROLE_REVIEWER_*: [ROLE_REVIEWER]

    # accepting or rejecting a proposal requires having typed one's password in the last 15 minutes
    recent_authentication_lifetime: 900

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # third-party clients call the API with an access token of the identity provider
        api:
            pattern: ^/api/
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            access_token:
                token_handler:
                    oidc: &oidc
                        discovery:
                            # with a trailing slash: the discovery path is resolved against it as a relative URL
                            base_uri: '%env(OIDC_ISSUER)%/'
                            # the keys of the discovery document only verify the tokens of the issuer it announces
                            check_issuer: true
                        audience: showcase-api
                        claim: email
                        # Keycloak types its access tokens "JWT", not "at+jwt" (RFC 9068)
                        enforce_at_jwt_type: false
                # served at /.well-known/oauth-protected-resource, telling clients where to get a token (RFC 9728)
                resource_metadata: &resource_metadata
                    authorization_servers: ['%env(OIDC_ISSUER)%']
                    scopes_supported: ['proposals:write']
        # the MCP server only accepts the tokens bound to its URL, which the API rejects
        mcp:
            pattern: ^/mcp$
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            access_token:
                token_handler:
                    oidc:
                        <<: *oidc
                        # MCP clients ask Keycloak for tokens bound to this URL, with the "resource" parameter of RFC 8707
                        audience: '%env(MCP_RESOURCE)%'
                # served at /.well-known/oauth-protected-resource/mcp, with the origin of the request
                resource_metadata:
                    <<: *resource_metadata
                    resource: /mcp
        main:
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            # a user disabled by an admin is logged out on their next request
            user_checker_on_refresh: true
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            # speakers log in with the identity provider of the conference
            oidc_login:
                provider_uri: '%env(OIDC_ISSUER)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_basic: '%env(OIDC_CLIENT_SECRET)%'
                scope: [profile, email]
                user_identifier_claim: email
                refresh_access_token: true
                enable_end_session: true
                backchannel_logout: true
            logout:
                path: app_logout
                enable_csrf: true
            switch_user:
                path: switch_user
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_REVIEWER }
        - { path: ^/me, roles: ROLE_USER }
        - { path: ^/mcp$, roles: ROLE_USER }
