# yaml-language-server: $schema=../schema.json
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # the repository creates the users who log in with the identity provider for the first time
        app_users:
            entity:
                class: App\Entity\User

    role_hierarchy:
        ROLE_ADMIN: [ROLE_ORGANIZER, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ORGANIZER: [ROLE_REVIEWER]
        # reviewers of a single conference, e.g. ROLE_REVIEWER_LILLE
        ROLE_REVIEWER_*: [ROLE_REVIEWER]

    # accepting or rejecting a proposal requires having typed one's password in the last 15 minutes
    recent_authentication_lifetime: 900

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # third-party clients call the API with an access token of the identity provider
        api:
            pattern: ^/api/
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            # the challenge answering a missing or invalid token tells where to get one (RFC 9728)
            entry_point: App\Security\AccessTokenChallenge
            access_token:
                failure_handler: App\Security\AccessTokenChallenge
                token_handler:
                    oidc:
                        discovery:
                            # with a trailing slash: the discovery path is resolved against it as a relative URL
                            base_uri: '%env(OIDC_ISSUER)%/'
                            cache: { id: cache.app }
                        issuers: ['%env(OIDC_ISSUER)%']
                        algorithms: [RS256]
                        audience: showcase-api
                        claim: email
        main:
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            # a user disabled by an admin is logged out on their next request
            user_checker_on_refresh: true
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            # speakers log in with the identity provider of the conference
            oidc_login:
                provider_uri: '%env(OIDC_ISSUER)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_basic: '%env(OIDC_CLIENT_SECRET)%'
                scope: [profile, email]
                user_identifier_claim: email
                refresh_access_token: true
                enable_end_session: true
                backchannel_logout: true
            logout:
                path: app_logout
                enable_csrf: true
            switch_user:
                path: switch_user
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_REVIEWER }
        - { path: ^/me, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
