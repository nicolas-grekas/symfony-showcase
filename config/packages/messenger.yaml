# yaml-language-server: $schema=../schema.json
messenger:
    failure_transport: failed

    # every message gets a MessageId, and the messages dispatched while handling one share its Correlation
    identity_stamps: true

    transports:
        # https://symfony.com/doc/current/messenger.html#transport-configuration
        async: '%env(MESSENGER_TRANSPORT_DSN)%'
        # domain events go to RabbitMQ only once the database transaction that recorded them commits:
        # they wait in the "events.outbox" transport created from this DSN
        events:
            dsn: '%env(RABBITMQ_DSN)%/%%2f/events'
            outbox: 'doctrine://default?queue_name=outbox'
            # a redelivered event whose handlers committed already is acknowledged without handling it again
            inbox: true
            retry_strategy:
                max_retries: 2
                delay: 500
        failed:
            dsn: 'doctrine://default?queue_name=failed'
            sign: true

    buses:
        messenger.bus.default:
            middleware:
                - logging
                - doctrine_dbal_transaction

    routing:
        Symfony\Component\Mailer\Messenger\SendEmailMessage: async
        Symfony\Component\Notifier\Message\ChatMessage: async
        Symfony\Component\Notifier\Message\SmsMessage: async
        # webhooks are acknowledged right away and consumed by a worker
        Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: async
        Symfony\Component\Webhook\Messenger\SendWebhookMessage: async
        App\Message\DomainEvent: events
        App\Message\TravelCommand: events

when@test:
    messenger:
        transports:
            async: 'in-memory://'
            events:
                dsn: 'in-memory://'
                outbox: 'in-memory://'
