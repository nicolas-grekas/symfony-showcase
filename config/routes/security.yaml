_security_logout:
    resource: security.route_loader.logout
    type: service

_security_oidc_login:
    resource: security.authenticator.oidc_login.route_loader
    type: service

app_logout:
    path: /logout
    methods: [POST]

# reached only when the impersonation form misses its "_switch_user" field
switch_user:
    path: /switch-user
    methods: [POST]
    controller: Symfony\Component\Routing\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /
