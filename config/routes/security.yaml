_security:
    resource: security.route_loader
    type: service

# POST only: a GET request gets a 405 instead of reaching the logout listener
app_logout:
    path: /logout
    methods: [POST]

# reached only when the impersonation form misses its "_switch_user" field
switch_user:
    path: /switch-user
    methods: [POST]
    controller: Symfony\Component\Routing\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /
