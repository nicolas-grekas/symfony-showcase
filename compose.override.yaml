
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> keycloak ###
  keycloak:
    ports:
      # a fixed port, as the issuer of the tokens is the URL the browser uses
      - "8180:8080"
###< keycloak ###

###> rabbitmq ###
  rabbitmq:
    ports:
      - "5672"
      - "15672"
###< rabbitmq ###

###> symfony/mercure-bundle ###
  mercure:
    ports:
      - "80"
###< symfony/mercure-bundle ###
